[package]
name = "fde-study"
version = "0.1.0"
edition = "2024"
publish = false
# 로컬 `cargo run`은 127.0.0.1 서버를 띄운다. api/fde.rs는 Vercel 함수용이다.
default-run = "fde-study"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
tower = "0.5.3"
vercel_runtime = { version = "2.4.1", features = ["axum"] }

[[bin]]
name = "fde-study"
path = "src/main.rs"

# Vercel Rust runtime: api/ 아래 함수마다 [[bin]]이 필요하다.
[[bin]]
name = "fde"
path = "api/fde.rs"

# vercel/examples rust/axum과 같은 릴리스 설정.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
